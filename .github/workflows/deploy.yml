name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:   # allows manual trigger from the GitHub Actions UI

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: portfolio_test
          POSTGRES_USER: portfolio_test
          POSTGRES_PASSWORD: disposable-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio_test -d portfolio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DB: portfolio_test
      POSTGRES_USER: portfolio_test
      POSTGRES_PASSWORD: disposable-test-password
      POSTGRES_HOST: localhost
      SESSION_SECRET: disposable-test-session-secret
      ENCRYPTION_KEY: disposable-test-encryption-placeholder
      TEST_DATABASE_URL: postgresql+psycopg2://portfolio_test:disposable-test-password@localhost:5432/portfolio_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: |
          alembic upgrade head
          pytest tests/ -v
          node --test tests/*.cjs

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          passphrase: ${{ secrets.EC2_SSH_PASSPHRASE }}
          script: |
            set -euo pipefail
            cd /opt/trading212

            echo "--- Pulling latest code ---"
            git pull origin main

            echo "--- Building and restarting containers ---"
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            echo "--- Removing unused Docker images ---"
            docker image prune -f

            echo "--- Deploy complete: $(date) ---"
